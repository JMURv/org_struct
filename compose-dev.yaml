name: org-struct-dev
services:
  db:
    extends:
      file: compose.yaml
      service: db
    volumes: !override
      - pg_data_dev:/var/lib/postgresql/data
    networks: !override [ org-struct-dev ]

  backend:
    image: org-struct-backend:latest-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: !override
      - ./build/configs/envs/.env.dev
    extends:
      file: compose.yaml
      service: backend
    networks: !override [ org-struct-dev ]
    develop:
      watch: !override
        - action: sync
          path: backend
          target: /app
          ignore:
            - .git
            - vendor

  jaeger:
    extends:
      service: jaeger
      file: compose.yaml
    networks: !override [ org-struct-dev ]

  prometheus:
    extends:
      service: prometheus
      file: compose.yaml
    volumes: !override
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_dev:/prometheus
    networks: !override [ org-struct-dev ]

  node-exp:
    extends:
      service: node-exp
      file: compose.yaml
    networks: !override [ org-struct-dev ]

  grafana:
    extends:
      service: grafana
      file: compose.yaml
    volumes: !override
      - grafana_data_dev:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: !override [ org-struct-dev ]

  loki:
    extends:
      service: loki
      file: compose.yaml
    volumes: !override
      - loki_data_dev:/loki
      - ./configs/loki:/etc/loki
    networks: !override [ org-struct-dev ]

  promtail:
    extends:
      service: promtail
      file: compose.yaml
    networks: !override [ org-struct-dev ]

  postgres-exporter:
    extends:
      service: postgres-exporter
      file: compose.yaml
    networks: !override [ org-struct-dev ]

  redis-exporter:
    extends:
      service: redis-exporter
      file: compose.yaml
    networks: !override [ org-struct-dev ]

volumes:
  pg_data_dev:
  prometheus_data_dev:
  grafana_data_dev:
  loki_data_dev:

networks:
  org-struct-dev:
    name: org-struct-dev
